# Both PCs get identical packages from uv.lock:  uv sync
[project]
name = "manafe3"
version = "0.1.0"
description = "Manafe3 PEB engineering engine: a local FastAPI server the browser app calls."
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Ahmed Ali" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    # production frame solver (pinned by bimsteelauto to the verified 3.0.0)
    "PyNiteFEA==3.0.0",
    # independent cross-check solver, as in BIMSteelAuto
    "anastruct>=1.6",
    # the engineering engine (public, MIT), a git dependency pinned to one commit in [tool.uv.sources]
    "bimsteelauto",
    # ECP 205-LRFD member checks (the user's library, MIT), a git dependency pinned to one commit in [tool.uv.sources]
    "ecp205-lrfd",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "sectionproperties>=3.10.2",
    # memory of each test file's process tree (tools/run-tests-by-file.py); was only a transitive dependency
    "psutil>=7.2",
]

[tool.uv]
# a virtual project: the engine runs from the repo root, nothing is built or installed
package = false

[tool.uv.sources]
bimsteelauto = { git = "https://github.com/ahmedalisteel-star/bimsteelauto", rev = "3a2bf3fa1ae987a0f3ecb64a23831c1e6d71c4e8" }  # main: 0.15.3 fillet weld T-joint mode (2026-11-12); 0.15.2 anchor grade 4.6, ECP plate grades (2026-11-11); 0.15.1 DG 25; 0.14.3 E7
ecp205-lrfd = { git = "https://github.com/ahmedalisteel-star/ecp205-lrfd", rev = "7c459d70b676d2940137a097d057774dc4950e85" }  # main: 0.1.0 + cl. 4.3 flexural-torsional (2026-11-09)

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
markers = ["slow: solves whole frame lines (minutes); start-work.ps1 skips them, end-work.ps1 runs everything"]
pythonpath = ["."]
